<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Jibraj Karki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<section id="login" class="login" hidden>
  <form id="lf" class="login-card" novalidate>
    <div class="brand">Jibraj<i>.</i> <small>Admin</small></div>
    <h1>Sign in</h1>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div id="lerr" class="err" role="alert"></div>
    <button class="btn" type="submit">Sign in</button>
    <p class="muted">Authorized administrators only.</p>
  </form>
</section>

<div id="app" class="app" hidden>
  <aside id="side" class="side">
    <div class="brand">Jibraj<i>.</i> <small>Admin</small></div>
    <nav id="nav">
      <a href="#dashboard" data-k="dashboard">Dashboard</a>
      <a href="#vacancies" data-k="vacancies">Vacancies</a>
      <a href="#notices" data-k="notices">Notices</a>
      <a href="#syllabuses" data-k="syllabuses">Syllabus</a>
      <a href="#results" data-k="results">Results</a>
      <a href="#blogs" data-k="blogs">Blogs</a>
      <a href="#media" data-k="media">Media library</a>
    </nav>
    <div class="side-foot">
      <a href="../" target="_blank" rel="noopener">View website</a>
      <button id="out" class="btn ghost" type="button">Log out</button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button id="burger" class="burger" aria-label="Menu" type="button"><span></span><span></span><span></span></button>
      <h1 id="title">Dashboard</h1>
      <span id="who" class="muted"></span>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div id="toast" class="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
